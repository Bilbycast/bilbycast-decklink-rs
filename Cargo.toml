# bilbycast-decklink-rs — Blackmagic DeckLink SDI capture/playout for bilbycast-edge.
#
# Two-crate workspace mirroring `bilbycast-ffmpeg-video-rs`:
#   libdecklink-sys — raw FFI over FFmpeg libavdevice/libavformat/libavcodec/
#                     libavutil, built with the `decklink` in/out avdevice.
#   decklink-rs     — safe wrapper (DecklinkCapture, DecklinkPlayout,
#                     enumerate_devices) that bilbycast-edge depends on.
#
# Kept OUT of bilbycast-ffmpeg-video-rs on purpose: that crate is a minimal
# libavcodec/util/swscale build with `--disable-avdevice --disable-avformat`
# and no proprietary linkage. DeckLink needs both of those libs PLUS the
# Blackmagic DeckLink SDK headers at FFmpeg-configure time, so it lives here
# behind bilbycast-edge's off-by-default `sdi-decklink` feature.
[workspace]
resolver = "2"
members = [
    "libdecklink-sys",
    "decklink-rs",
]
