# bilbycast-decklink-rs — Blackmagic DeckLink SDI capture/playout for bilbycast-edge.
#
# Two-crate workspace mirroring `bilbycast-ffmpeg-video-rs`:
#   libdecklink-sys — a C++ shim exposing a C ABI over the Blackmagic DeckLink
#                     SDK, plus its bindgen FFI.
#   decklink-rs     — safe wrapper (DecklinkCapture, DecklinkPlayout,
#                     device_status, enumerate_devices) that bilbycast-edge
#                     depends on.
#
# Kept OUT of bilbycast-ffmpeg-video-rs on purpose: this workspace needs the
# Blackmagic DeckLink SDK headers at build time and links no FFmpeg at all, so
# it lives here behind bilbycast-edge's off-by-default `sdi-decklink` feature.
[workspace]
resolver = "2"
members = [
    "libdecklink-sys",
    "decklink-rs",
]
